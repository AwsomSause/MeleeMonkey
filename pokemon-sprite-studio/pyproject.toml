[project]
name = "psas-backend"
version = "0.0.1"
description = "Pokémon Sprite & Animation Studio — backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real paid provider; skipped unless PSAS_ALLOW_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
packages = ["backend"]
